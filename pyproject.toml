[project]
name = "fnkit"
version = "0.6.0"
description = "Slightly alternative way to write the code"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vitaliy Muminov", email = "vitaliy.muminov+github@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []
keywords = ["functional", "monad", "option", "result", "state", "types"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/vmuminov/fnkit"
Repository = "https://github.com/vmuminov/fnkit"
Issues = "https://github.com/vmuminov/fnkit/issues"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "N", "C4", "SIM", "RET", "PTH", "FURB", "ISC", "T20"]
extend-safe-fixes = ["B", "C4", "PT", "UP", "ISC"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-fail-under=80 --cov-report=term-missing"

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
strict = ["src/**/*.py"]
exclude = ["src/**/__init__.py", "**/__pycache__", "**/.*", ".venv"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]
